[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websec"
version = "0.1.0"
description = "A python web security posture analyzer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "rich>=13,<15",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
websec = "websec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]